name: Userscript

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.mjs --check
      - run: node --check golab-enhancements.user.js
      - run: node --test test/scoring.test.mjs
