<main class="home-main">
    <section class="home-start" aria-labelledby="home-title">
        <h1 id="home-title">Go Lab</h1>
        <p class="home-description">A shared board for playing and reviewing Go.</p>
        <form class="create-board" method="post" action="/new">
            <label for="board_id">Board name <span>(optional)</span></label>
            <div class="create-board-fields">
                <input id="board_id" class="form-control" type="text" name="board_id" placeholder="e.g. sunday-study" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="board-hint">
                <button class="btn btn-primary" type="submit">Open board</button>
            </div>
            <p id="board-hint">Leave blank to create a board, or enter an existing name to rejoin.</p>
        </form>
        <p class="home-help">Share the board's link to invite someone. You can also import SGF, GIB, or NGF files to review a game.</p>
        <p class="home-meta">Free and open source. No account needed.</p>
    </section>
</main>
